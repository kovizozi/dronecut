name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg + audio libs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install dronecut (CPU, no ML extras)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (CPU, synthetic media generated in the run)
        run: pytest -q -m "not gpu"
